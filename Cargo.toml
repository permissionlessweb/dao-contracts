[workspace]
exclude = ["ci/configs/", "ci/optimizer/", "contracts/voting/dao-voting-onft-staked", "contracts/external/dao-migrator", "wasmvm/libwasmvm"]
members = [
    "ci/*",
    "contracts/dao-dao-core",
    "contracts/delegation/*",
    "contracts/distribution/*",
    "contracts/external/*",
    "contracts/gauges/*",
    "contracts/pre-propose/*",
    "contracts/proposal/*",
    "contracts/staking/*",
    "contracts/test/*",
    "contracts/voting/*",
    "packages/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/DA0-DA0/dao-contracts"
version = "2.8.0-alpha.2"

[workspace.dependencies]
anybuf = { version = "0.5.0" }
anyhow = { version = "1.0" }
assert_matches = "1.5"
base64 = "0.22.1"
bech32 = "0.11.1"
chrono = "0.4"
cosm-orc = { version = "4.0" }
cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto" }
cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../cosmwasm/packages/std", features = ["cosmwasm_1_2", "cosmwasm_2_2", "stargate"] }
cw-controllers = { path = "../cw-minus/packages/controllers" }
cw-multi-test = { package = "abstract-cw-multi-test", path = "../cw-multi-test-fork" }
cw-ownable = { path = "../cw-plus-plus/packages/ownable" }
cw-storage-plus = { path = "../cw-storage-plus" }
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw721-nips = { path = "../terp-rs/crates/public/nips" }
cw2 = { path = "../cw-minus/packages/cw2" }
cw20 = { path = "../cw-plus/packages/cw20" }
cw20-base = { path = "../cw-plus/contracts/cw20-base" }
cw3 = { path = "../cw-plus/packages/cw3" }
cw4 = { path = "../cw-plus/packages/cw4" }
cw4-group = { path = "../cw-plus/contracts/cw4-group" }
cw721 = { path = "../cw-nfts/packages/cw721" }
cw721-base = { path = "../cw-nfts/contracts/cw721-base" }
env_logger = "0.11.10"
once_cell = "1.18"
osmosis-std = { path = "../osmosis-rust/packages/osmosis-std" }
osmosis-std-derive = { path = "../osmosis-rust/packages/osmosis-std-derive" }
osmosis-test-tube = { path = "../osmosis-test-tube/packages/osmosis-test-tube" }
proc-macro2 = "1.0"
prost = { version = "=0.14.3" }
prost-reflect = { version = "=0.16.3", features = ["serde"] }
prost-types = { version = "=0.14.3", default-features = false }
quote = "1.0"
rand = "0.8"
regex = "1.12.3"
schemars  = "1.2.1"
semver = "1.0.20"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-cw-value = "0.7"
serde_json = "1.0"
serde_yaml = "0.9"
sg-multi-test = "3.1.0"
syn = { version = "1.0", features = ["derive"] }
test-context = "0.1"
thiserror = { version = "1.0" }
# One commit ahead of version 0.3.0. Allows initialization with an
# optional owner.

cw-orch = { path = "../cw-orchestrator/cw-orch" }

btsg-ft-factory = { path = "./contracts/external/btsg-ft-factory", version = "2.8.0-alpha.2" }
cw-admin-factory = { path = "./contracts/external/cw-admin-factory", version = "2.8.0-alpha.2" }
cw-denom = { path = "./packages/cw-denom", version = "2.8.0-alpha.2" }
cw-filter = { path = "./contracts/external/cw-filter", version = "2.8.0-alpha.2" }
cw-fund-distributor = { path = "./contracts/distribution/cw-fund-distributor", version = "2.8.0-alpha.2" }
cw-hooks = { path = "./packages/cw-hooks", version = "2.8.0-alpha.2" }
cw-jsonfilter = { path = "./packages/cw-jsonfilter", version = "2.8.0-alpha.2" }
cw-paginate-storage = { path = "./packages/cw-paginate-storage", version = "2.8.0-alpha.2" }
cw-payroll-factory = { path = "./contracts/external/cw-payroll-factory", version = "2.8.0-alpha.2" }
cw-protobuf-registry = { path = "./contracts/external/cw-protobuf-registry", version = "2.8.0-alpha.2" }
cw-reply-helper = { path = "./packages/cw-reply-helper", version = "2.8.0-alpha.2" }
cw-snapshot-vector-map = { path = "./packages/cw-snapshot-vector-map", version = "2.8.0-alpha.2" }
cw-stake-tracker = { path = "./packages/cw-stake-tracker", version = "2.8.0-alpha.2" }
cw-token-swap = { path = "./contracts/external/cw-token-swap", version = "2.8.0-alpha.2" }
