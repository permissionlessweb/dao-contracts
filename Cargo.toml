dao-voting-cw20-staked = { path = "./contracts/voting/dao-voting-cw20-staked", version = "2.8.0-alpha.2" }
dao-voting-cw4 = { path = "./contracts/voting/dao-voting-cw4", version = "2.8.0-alpha.2" }
