[workspace]
exclude = ["ci/configs/", "contracts/voting/dao-voting-onft-staked", "wasmvm/libwasmvm"]
members = [
    "ci/*",
    "contracts/dao-dao-core",
    "contracts/delegation/*",
    "contracts/distribution/*",
    "contracts/external/*",
    "contracts/gauges/*",
    "contracts/pre-propose/*",
    "contracts/proposal/*",
    "contracts/staking/*",
    "contracts/test/*",
    "contracts/voting/*",
    "packages/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/DA0-DA0/dao-contracts"
version = "2.8.0-alpha.2"
[workspace.dependencies]
anybuf = { version = "0.5.0" }
anyhow = { version = "1.0" }
assert_matches = "1.5"
base64 = "0.22.1"
bech32 = "0.11.1"
chrono = "0.4"
cosm-orc = { version = "4.0" }
cosm-tome = "0.2"
cosmos-sdk-proto = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "zk-mvp" }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cw-controllers = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw-multi-test = { package = "abstract-cw-multi-test", git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "zk-mvp" }
cw-ownable = { git = "https://github.com/permissionlessweb/cw-plus-plus", branch = "zk-mvp" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "zk-mvp" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw20 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw20-base = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw3 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw4 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw4-group = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw721 = { git = "https://github.com/permissionlessweb/cw-nfts", branch = "zk-mvp" }
cw721-base = { git = "https://github.com/permissionlessweb/cw-nfts", branch = "zk-mvp" }
env_logger = "0.11.10"
once_cell = "1.18"
osmosis-std = { git = "https://github.com/permissionlessweb/osmosis-rust", branch = "zk-mvp" }
osmosis-std-derive = { git = "https://github.com/permissionlessweb/osmosis-rust", branch = "zk-mvp" }
osmosis-test-tube = { git = "https://github.com/permissionlessweb/osmosis-test-tube", branch = "zk-mvp" }
proc-macro2 = "1.0"
prost = { version = "=0.14.3" }
prost-reflect = { version = "=0.16.3", features = ["serde"] }
prost-types = { version = "=0.14.3", default-features = false }
quote = "1.0"
rand = "0.8"
regex = "1.12.3"
schemars  = "1.2.1"
semver = "1.0.20"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-cw-value = "0.7"
serde_json = "1.0"
serde_yaml = "0.9"
sg-multi-test = "3.1.0"
syn = { version = "1.0", features = ["derive"] }
test-context = "0.1"
thiserror = { version = "1.0" }
# One commit ahead of version 0.3.0. Allows initialization with an
# optional owner.

cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }

