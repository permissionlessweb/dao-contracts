[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
panic = 'abort'
rpath = false
# Please do not disable these. Doing so will cause overflow checks in
# all workspace members to stop working. Overflows should be errors.
overflow-checks = true

[profile.release.package.cw-protobuf-registry]
opt-level = "z"

[patch.crates-io]
# cw-minus# cw-plus# cw-plus-plus# cw-nfts# cosmos-rust# osmosis# local

