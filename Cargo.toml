[workspace]
exclude = [
    "ci/configs/",
    "ci/optimizer/",
    "contracts/external/dao-migrator",
    "contracts/voting/dao-voting-onft-staked",
    "wasmvm/libwasmvm",
]
members = [
    "ci/*",
    "contracts/dao-dao-core",
    "contracts/delegation/*",
    "contracts/distribution/*",
    "contracts/external/*",
    "contracts/gauges/*",
    "contracts/pre-propose/*",
    "contracts/proposal/*",
    "contracts/staking/*",
    "contracts/test/*",
    "contracts/voting/*",
    "packages/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/DA0-DA0/dao-contracts"
version = "2.9.0-delta.9"

[workspace.dependencies]
anybuf = { version = "0.5.0" }
anyhow = { version = "1.0" }
assert_matches = "1.5"
base64 = "0.22.1"
bech32 = "0.11.1"
chrono = "0.4"
cosm-orc = { version = "4.0" }
cosmos-sdk-proto = { version = "0.28.0" }
cosmwasm-schema = { version = "=4.0.0-zk" }
cosmwasm-std = { version = "=4.0.0-zk", features = ["cosmwasm_1_2", "cosmwasm_2_2", "stargate"] }
cw-controllers = { version = "3.0.0" }
cw-multi-test = { package = "abstract-cw-multi-test", version = "=3.0.0-rc" }
