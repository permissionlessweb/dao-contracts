cw2 = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw20 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw20-base = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
