[workspace]
exclude = ["ci/configs/", "ci/optimizer/", "contracts/voting/dao-voting-onft-staked", "contracts/external/dao-migrator", "wasmvm/libwasmvm"]
members = [
    "ci/*",
    "contracts/dao-dao-core",
    "contracts/delegation/*",
    "contracts/distribution/*",
    "contracts/external/*",
    "contracts/gauges/*",
    "contracts/pre-propose/*",
    "contracts/proposal/*",
    "contracts/staking/*",
    "contracts/test/*",
    "contracts/voting/*",
    "packages/*", "scripts",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/DA0-DA0/dao-contracts"
version = "2.8.0-alpha.3"

[workspace.dependencies]
anybuf = { version = "0.5.0" }
anyhow = { version = "1.0" }
assert_matches = "1.5"
base64 = "0.22.1"
bech32 = "0.11.1"
chrono = "0.4"
cosm-orc = { version = "4.0" }
cosmos-sdk-proto = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "zk-mvp" }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp", features = ["cosmwasm_1_2", "cosmwasm_2_2", "stargate"] }
cw-controllers = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw-multi-test = { package = "abstract-cw-multi-test", git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "zk-mvp" }
