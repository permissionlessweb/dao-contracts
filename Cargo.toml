[workspace]
exclude = ["ci/configs/", "wasmvm/libwasmvm", "contracts/voting/dao-voting-onft-staked"]
members = [
  "contracts/dao-dao-core",
  "contracts/distribution/*",
  "contracts/delegation/*",
  "contracts/external/*",
  "contracts/gauges/*",
  "contracts/proposal/*",
  "contracts/pre-propose/*",
  "contracts/staking/*",
  "contracts/test/*",
  "contracts/voting/*",
  "packages/*",
  "ci/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/DA0-DA0/dao-contracts"
version = "2.8.0-alpha.2"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
panic = 'abort'
rpath = false
# Please do not disable these. Doing so will cause overflow checks in
# all workspace members to stop working. Overflows should be errors.
overflow-checks = true

[profile.release.package.cw-protobuf-registry]
opt-level = "z"

[patch.crates-io]
# cw-minus
cw-utils       = { path = "../cw-minus/packages/cw-utils" }
cw2            = { path = "../cw-minus/packages/cw2" }
cw-controllers = { path = "../cw-minus/packages/controllers" }
# cw-plus
cw20           = { path = "../cw-plus/packages/cw20" }
cw20-base      = { path = "../cw-plus/contracts/cw20-base" }
cw3            = { path = "../cw-plus/packages/cw3" }
cw4            = { path = "../cw-plus/packages/cw4" }
cw4-group      = { path = "../cw-plus/contracts/cw4-group" }
# cw-plus-plus
cw-ownable     = { path = "../cw-plus-plus/packages/ownable" }
# cw-nfts
cw721          = { path = "../cw-nfts/packages/cw721" }
cw721-base     = { path = "../cw-nfts/contracts/cw721-base" }
# cosmos-rust
cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto" }
# osmosis
osmosis-std        = { path = "../osmosis-rust/packages/osmosis-std" }
osmosis-std-derive = { path = "../osmosis-rust/packages/osmosis-std-derive" }
osmosis-test-tube  = { path = "../osmosis-test-tube/packages/osmosis-test-tube" }
# local
cw-orch    = { path = "../cw-orchestrator/cw-orch", default-features = false }

[workspace.dependencies]
anybuf = { version = "0.5.0" }
anyhow = { version = "1.0" }
assert_matches = "1.5"
bech32 = "0.11.1"
base64 = "0.22.1"
chrono = "0.4"
cosm-orc = { version = "4.0" }
cosm-tome = "0.2"
cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto" }
cosmwasm-schema = "3.0.4"
cosmwasm-std = { version = "3.0.4", features = ["stargate", "cosmwasm_2_2"] }
cw-controllers = { path = "../cw-minus/packages/controllers" }
cw-multi-test = { version = "3.0.1", features = ["staking", "stargate", "cosmwasm_2_0"] }
cw-storage-plus = "3.0.1"
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw2 = { path = "../cw-minus/packages/cw2" }
cw20            = { path = "../cw-plus/packages/cw20" }
cw20-base       = { path = "../cw-plus/contracts/cw20-base" }
cw4                = { path = "../cw-plus/packages/cw4" }
cw4-group          = { path = "../cw-plus/contracts/cw4-group" }
cw3             = { path = "../cw-plus/packages/cw3" }
cw-ownable      = { path = "../cw-plus-plus/packages/ownable" }
cw721 = { path = "../cw-nfts/packages/cw721" }
cw721-base = { path = "../cw-nfts/contracts/cw721-base" }
env_logger = "0.11.10"
once_cell = "1.18"
osmosis-std = { path = "../osmosis-rust/packages/osmosis-std" }
osmosis-std-derive = { path = "../osmosis-rust/packages/osmosis-std-derive" }
osmosis-test-tube = { path = "../osmosis-test-tube/packages/osmosis-test-tube" }
proc-macro2 = "1.0"
prost = { version = "=0.14.3" }
prost-types = { version = "=0.14.3", default-features = false }
prost-reflect = { version = "=0.16.3", features = ["serde"] }
quote = "1.0"
rand = "0.8"
regex = "1.12.3"
schemars  = "1.2.1"
semver = "1.0.20"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-cw-value = "0.7"
serde_json = "1.0"
serde_yaml = "0.9"
sg-multi-test = "3.1.0"
syn = { version = "1.0", features = ["derive"] }
test-context = "0.1"
thiserror = { version = "1.0" }

# One commit ahead of version 0.3.0. Allows initialization with an
# optional owner.

cw-orch = { path = "../cw-orchestrator/cw-orch", default-features = false }

